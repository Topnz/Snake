<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Python</title>
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/menu.css" />
    <link rel="stylesheet" href="./css/game.css" />
  </head>
  <body>
    <nav class="nav">
      <img src="pictures/snakebanner.png" alt="snakebanner" />
    </nav>
    <div class="container">
      <div class="score-container">Press any button to start snaking!</div>
      <div class="game-container"></div>
      <div class="menu-container">
        <div>
          <section id="title-section">
            <h1>PYTHON SNAKE GAME</h1>
          </section>
        </div>
        <div class="highscore-container">
          <h3 id="highscore">Highscore:</h3>
        </div>
        <div>
          <img
            id="controls"
            src="./pictures/controls.png"
            alt="WASD and arrow controls"
          />
        </div>
        <div class="difficulty-container">
          <button class="easy">EASY</button>
          <button class="intermediate">INTERMEDIATE</button>
          <button class="hard">HARD</button>
          <button class="extreme">EXTREME</button>
          <button class="impossible">IMPOSSIBLE</button>
        </div>
        <div class="tutorial-container">
          <h1>HOW TO PLAY:</h1>
          <h3>
            WELCOME TO THE PYTHON SNAKE GAME!
            <br />
            PICK YOUR DIFFICULTY AND USE THE SHOWN KEYS TO START SNAKING!
          </h3>
        </div>
      </div>
    </div>
    <script src="./js/snake.js"></script>
    <script src="./js/menu.js"></script>
  </body>
</html>
